# mpc
receding: 15
step_time: 0.15
ref_speed: 0.4
device: 'cpu'
time_print: False
collision_threshold: 0.002

# robot
robot:
  kinematics: 'diff'
  max_speed: [0.4, 0.9]
  max_acce: [1.3, 0.8]
  length: 0.25
  width: 0.17

# initial path
ipath:
  interval: 0.2
  # waypoints: [[0, 0, 0], [1, 0, 0]]
  curve_style: 'line'   # 'dubins' or reeds or line
  min_radius: 0.05
  loop: False
  arrive_threshold: 0.3
  close_threshold: 0.03
  arrive_index_threshold: 3
  
# proximal alternating minimization network
pan:
  iter_num: 25
  dune_max_num: 200
  nrmp_max_num: 10
  dune_checkpoint: None
  iter_threshold: 0.05

# adjust parameters
adjust:
  q_s: 0.24
  p_u: 19.0
  eta: 0.6
  d_max: 1.1
  d_min: 0.09
