# Corridor Navigation Map (NeuPAN Style)
# 2m wide horizontal corridor with obstacle walls inside
# Map coordinate system: center at origin (-5,-5) to (5,5)
# Designed for limo vehicle (0.556m × 0.363m)

world:
  width: 10.0
  height: 10.0

obstacles:
  # ===== Boundary Walls (4 walls) =====

  # Bottom boundary wall
  - shape:
      type: 'rectangle'
      length: 10.4  # Map width + 2*thickness
      width: 0.2
    pose:
      x: 0.0
      y: -5.0
      yaw: 0.0

  # Top boundary wall
  - shape:
      type: 'rectangle'
      length: 10.4
      width: 0.2
    pose:
      x: 0.0
      y: 5.0
      yaw: 0.0

  # Left boundary wall
  - shape:
      type: 'rectangle'
      length: 10.0
      width: 0.2
    pose:
      x: -5.0
      y: 0.0
      yaw: 1.5708  # π/2 (90 degrees)

  # Right boundary wall
  - shape:
      type: 'rectangle'
      length: 10.0
      width: 0.2
    pose:
      x: 5.0
      y: 0.0
      yaw: 1.5708  # π/2 (90 degrees)

  # ===== Corridor Walls (2 long parallel walls) =====

  # Top corridor wall (y = +0.5, creating 1m wide corridor)
  - shape:
      type: 'rectangle'
      length: 10.0
      width: 0.2
    pose:
      x: 0.0
      y: 0.5
      yaw: 0.0

  # Bottom corridor wall (y = -0.5)
  - shape:
      type: 'rectangle'
      length: 10.0
      width: 0.2
    pose:
      x: 0.0
      y: -0.5
      yaw: 0.0

  # ===== Obstacle Walls Inside Corridor (4 walls) =====

  # Wall 1: Vertical wall, left-side-top
  - shape:
      type: 'rectangle'
      length: 0.4
      width: 0.15
    pose:
      x: -3.0
      y: 0.2
      yaw: 1.5708  # π/2 (90 degrees)

  # Wall 2: Vertical wall, center-left-bottom
  - shape:
      type: 'rectangle'
      length: 0.4
      width: 0.15
    pose:
      x: -1.0
      y: -0.2
      yaw: 1.5708  # π/2 (90 degrees)

  # Wall 3: Angled wall (~45°), center-right-mid
  - shape:
      type: 'rectangle'
      length: 0.55
      width: 0.1
    pose:
      x: 1.0
      y: 0.23
      yaw: 0.7854  # π/4 (45 degrees)

  # Wall 4: Angled wall (~90°), right-side-top
  - shape:
      type: 'rectangle'
      length: 0.2
      width: 0.1
    pose:
      x: 3.5
      y: 0.3
      yaw: 1.5708  # π/2 (90 degrees)

 # Wall 5: Angled wall (~90°), right-side-bottom
  - shape:
      type: 'rectangle'
      length: 0.2
      width: 0.1
    pose:
      x: 3.5
      y: -0.3
      yaw: 1.5708  # π/2 (90 degrees)
