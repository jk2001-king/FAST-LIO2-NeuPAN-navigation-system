amcl:
  ros__parameters:
    use_sim_time: True
    save_pose_rate: 0.5
    transform_tolerance: 1.0

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: "src/nav2/2dmap/fastlio_map_2d_2.yaml"

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_frame: odom

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # ⭐ [수정 1] 목표 지점 오차 허용 범위를 확 늘렸습니다. (도착지에 집착해서 도는 현상 방지)
      xy_goal_tolerance: 0.5 
      yaw_goal_tolerance: 0.5
      stateful: True

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      max_vel_x: 0.5
      max_vel_y: 0.0
      max_vel_theta: 1.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # ⭐ [수정 2] 장애물을 덜 무서워하고, 무조건 앞으로 전진하도록 가중치 조절!
      BaseObstacle.scale: 0.01 
      PathDefault.scale: 32.0
      GoalDefault.scale: 24.0
      PathAlign.scale: 5.0     # 경로 방향 맞추려는 집착 버리기
      GoalAlign.scale: 5.0     # 도착지 방향 맞추려는 집착 버리기
      PathDist.scale: 32.0     # 경로 따라가는 게 최우선!
      GoalDist.scale: 24.0     # 목표지점 가는 게 두 번째!

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      # ⭐ [수정 3] 로봇 몸집을 작게 인식시켜 좁은 복도를 과감하게 뚫고 가도록 세팅
      robot_radius: 0.2 
      resolution: 0.05
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # ⭐ [수정 4] 복도 공포증 치료의 핵심! 벽에서 나오는 위험 오라(Aura)를 대폭 줄임
        cost_scaling_factor: 1.0 
        inflation_radius: 0.15   

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # ⭐ [수정 3 동일] 
      robot_radius: 0.2
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: pointcloud
        scan:
          topic: /velodyne_points
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "PointCloud2"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # ⭐ [수정 4 동일] 복도 공포증 치료!
        cost_scaling_factor: 1.0
        inflation_radius: 0.15
